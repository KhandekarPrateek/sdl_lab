<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF to Excel Merger</title>

    <!-- Bootstrap CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body, html {
        height: 100%;
      }
      .centered-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="container centered-container">
      <div class="col-md-8">
        <h2 class="text-center mb-4">Merge PDF Files and Download Excel</h2>

        <form
          id="uploadForm"
          enctype="multipart/form-data"
          class="shadow p-4 rounded bg-light"
        >
          <div class="mb-3">
            <label for="pdfs" class="form-label">Select PDF Files:</label>
            <input
              type="file"
              name="pdfs"
              id="pdfs"
              class="form-control"
              multiple
              required
            />
            <small class="form-text text-muted"
              >You can select multiple PDF files.</small
            >
          </div>
          <div class="text-center">
            <button type="button" class="btn btn-primary" id="mergeButton">
              Merge
            </button>
            <button
              type="button"
              class="btn btn-success"
              id="downloadButton"
              disabled
            >
              Download Excel
            </button>
          </div>
        </form>

        <!-- Section to show the merged table -->
        <div id="mergedDataContainer" class="mt-4"></div>
      </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      document.getElementById('mergeButton').addEventListener('click', function () {
        const formData = new FormData(document.getElementById('uploadForm'));

        fetch('/merge', {
          method: 'POST',
          body: formData,
        })
          .then(response => response.json())
          .then(data => {
            // Display merged data in the HTML
            document.getElementById('mergedDataContainer').innerHTML = data.merged_data;

            // Enable download button
            document.getElementById('downloadButton').disabled = false;
          })
          .catch(error => {
            console.error('Error:', error);
          });
      });

      document.getElementById('downloadButton').addEventListener('click', function () {
        window.location.href = '/download';
      });
    </script>
  </body>
</html>
